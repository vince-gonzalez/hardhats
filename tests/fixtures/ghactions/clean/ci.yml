name: ci
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0  # v4.2.2
      - uses: astral-sh/setup-uv@b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1  # v5.1.0
      - name: build
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "building: $TITLE"
          ./build.sh
