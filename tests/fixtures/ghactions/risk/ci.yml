name: ci
on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: tj-actions/changed-files@main
      - name: greet
        run: echo "Thanks for the report, ${{ github.event.issue.title }}"
      - name: deploy
        run: |
          echo "building ref ${{ github.head_ref }}"
          ./build.sh
